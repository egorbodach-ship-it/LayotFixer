# LayoutFixer
# Исправляет команды, набранные в русской раскладке (/рщьу -> /home).

# Глобальный выключатель
enabled: true

# Исправлять только если исправленная команда реально существует
# (рекомендуется true, чтобы не трогать случайный ввод)
only-known-commands: true

# Сообщать игроку, что команда была исправлена
notify: true
notify-message: "&7[&aLayoutFixer&7] Исправлено на: &f/%command%"
